schema: spec-driven
context: |
  Repository: deepseek-free-api

  Project purpose:
  - Expose DeepSeek web chat as an OpenAI-compatible API using FastAPI and pure HTTP forwarding.
  - Preserve support for chat completions, streaming SSE, reasoning content, DSML-based tool calling, dynamic model discovery, file upload, vision, PoW solving, and token/session lifecycle management.

  Current architecture:
  - `proxy.py` is the single application entry and contains routing, admin UI, DeepSeek API integration, file upload helpers, model discovery, PoW request flow, SSE parsing, and OpenAI response shaping.
  - `tool_call.py`, `tool_dsml.py`, and `tool_sieve.py` implement DSML prompt injection, DSML parsing, and streaming tool-call separation.
  - `pow_native.py` bridges Node.js/WASM PoW solving with a pure Python fallback.
  - `usage_store.py` and `session_store.py` persist local operational state in JSON files.

  Runtime constraints:
  - Python 3.10+ application with FastAPI, uvicorn, curl-cffi, tiktoken, and python-dotenv declared in `requirements.txt`.
  - Node.js is expected for the primary PoW solver path; Python fallback exists but is slower.
  - DeepSeek upstream is reached through `chat.deepseek.com` endpoints and SSE responses are parsed and reshaped into OpenAI-compatible responses.
  - The codebase is intentionally small and mostly single-file; preserve that simplicity unless a change clearly benefits from extraction.

  Important behavioral realities from the current code:
  - `/v1/chat/completions` is the main product surface and is the highest-priority compatibility contract.
  - Function calling is simulated, not natively supported by DeepSeek; the implementation relies on prompt injection plus DSML extraction.
  - Non-stream requests internally use upstream streaming and buffer the SSE response before returning JSON.
  - Local credential and usage state are stored in JSON files in the repo root; do not commit generated secrets or runtime state.
  - Model availability is discovered dynamically from upstream and cached for one hour.

  What future specs should optimize for:
  - Capture user-visible API behavior, not incidental implementation details.
  - Distinguish clearly between current guaranteed behavior and implementation quirks or known gaps.
  - Keep requirements testable from HTTP/API perspective whenever possible.
rules:
  proposal:
    - Ground every proposed capability in the current repository and the actual product surface exposed by `proxy.py`.
    - Call out whether a change modifies external OpenAI-compatible behavior, admin/config behavior, or only internal implementation.
    - Treat runtime files (`token.json`, `usage.json`, `sessions.json`, `vision.log`) as operational state, not source artifacts.
  specs:
    - Write requirements in terms of observable behavior at the HTTP API boundary or persisted operational behavior.
    - Use separate capabilities for distinct domains instead of creating one giant umbrella spec.
    - For this project, prefer capabilities that map to coherent surfaces: API compatibility, auth/session lifecycle, model discovery, tool calling, file handling, and operations/deployment.
    - Do not promise native OpenAI semantics where the current implementation is only best-effort compatibility.
  design:
    - Reference the existing single-file architecture explicitly when a design proposes refactoring or extraction.
    - Document upstream DeepSeek assumptions and failure modes whenever they shape the design.
    - Make external dependency changes explicit, especially anything affecting FastAPI, curl-cffi, Node.js, or SSE parsing.
  tasks:
    - Keep tasks small and executable against the current repo layout.
    - Include validation tasks for API compatibility and OpenSpec validation whenever a change edits specs or routing behavior.
